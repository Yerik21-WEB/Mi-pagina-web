 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto a QR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Asegura que el padding no desborde el ancho */
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #218838;
        }
        #contenedor-qr {
            margin-top: 25px;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Registro de Contacto</h2>
        <form id="formularioContacto">
            <div class="form-group">
                <label for="nombres">Nombres:</label>
                <input type="text" id="nombres" required placeholder="Ej. Juan">
            </div>
            <div class="form-group">
                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos" required placeholder="Ej. Pérez">
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono (Celular):</label>
                <input type="tel" id="telefono" required placeholder="+1 809 555 1234">
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" required placeholder="juan@ejemplo.com">
            </div>
            <div class="form-group">
                <label for="empresa">Empresa:</label>
                <input type="text" id="empresa" placeholder="Ej. TechCorp">
            </div>
            
            <button type="submit">Generar Código QR</button>
        </form>

        <div id="contenedor-qr"></div>
    </div>

    <script>
        document.getElementById('formularioContacto').addEventListener('submit', function(evento) {
            // Prevenimos que la página se recargue al enviar el formulario
            evento.preventDefault();

            // 1. Obtenemos los valores ingresados en el formulario
            const nombres = document.getElementById('nombres').value;
            const apellidos = document.getElementById('apellidos').value;
            const telefono = document.getElementById('telefono').value;
            const email = document.getElementById('email').value;
            const empresa = document.getElementById('empresa').value;

            // 2. Construimos la cadena de texto en formato vCard
            // El formato vCard es el estándar que los celulares reconocen para agendas telefónicas.
            const vcard = `BEGIN:VCARD
VERSION:3.0
N:${apellidos};${nombres};;;
FN:${nombres} ${apellidos}
ORG:${empresa}
TEL;TYPE=CELL:${telefono}
EMAIL;TYPE=PREF,INTERNET:${email}
END:VCARD`;

            // 3. Limpiamos cualquier código QR que se haya generado anteriormente
            const contenedorQR = document.getElementById('contenedor-qr');
            contenedorQR.innerHTML = "";

            // 4. Generamos el nuevo código QR utilizando la librería
            new QRCode(contenedorQR, {
                text: vcard,
                width: 220,
                height: 220,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.M // Nivel de corrección de errores
            });
        });
    </script>

</body>
</html>
